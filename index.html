<!DOCTYPE html>
<html lang="en">
<head>

<!-- 🔐 PASSWORD PROTECTION -->
<script>
  const correctPassword = "sarkar123"; // 🔴 CHANGE PASSWORD HERE
  
  function checkPassword() {
    const userPassword = prompt("Enter the secret password 💖");
    
    if (userPassword === null) {
      // User clicked cancel
      document.body.innerHTML = "<div style='text-align: center; margin-top: 100px; font-family: Arial; color: #ff0000; font-size: 24px; display: block;'><h1>Access Denied ❌</h1><p>Password required to access this page.</p></div>";
      document.body.style.display = "block";
      return false;
    }
    
    if (userPassword !== correctPassword) {
      alert("Wrong Password! Access Denied ❌");
      document.body.innerHTML = "<div style='text-align: center; margin-top: 100px; font-family: Arial; color: #ff0000; font-size: 24px; display: block;'><h1>Access Denied ❌</h1><p>Incorrect password entered.</p></div>";
      document.body.style.display = "block";
      return false;
    }
    
    // Password is correct, show the content
    document.addEventListener('DOMContentLoaded', function() {
      document.body.classList.add('authorized');
    });
    return true;
  }
  
  // Check password immediately when script runs
  if (!checkPassword()) {
    throw new Error("Unauthorized access");
  }
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Sarkar</title>

<style>
/* Initially hide body content */
body {
    display: none;
}

body.authorized {
    display: flex;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Comic Sans MS', cursive, sans-serif;
}

body.authorized {
    background-image: url('1.jpg');
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-color: #ff9a9e;
    height: 100vh;
    overflow: hidden;
    justify-content: center;
    align-items: center;
    position: relative;
}

body.authorized::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg,
        rgba(255,182,193,0.08),
        rgba(255,200,220,0.05));
    z-index: 1;
}

.container {
    text-align: center;
    z-index: 10;
    padding: 3rem 2.5rem;
    max-width: 850px;
    background: rgba(255,255,255,0.45);
    border-radius: 30px;
    backdrop-filter: blur(6px);
    box-shadow: 0 15px 40px rgba(255,20,147,0.5);
}

h1 {
    font-size: 4rem;
    color: #FF1493;
    margin-bottom: 1.5rem;
    animation: bounce-in 1.5s forwards;
}

.subtitle {
    font-size: 1.6rem;
    color: #8A2BE2;
    margin-bottom: 2rem;
}

.next-button {
    padding: 1.2rem 3.5rem;
    font-size: 1.5rem;
    background: linear-gradient(45deg, #FF1493, #8A2BE2);
    color: white;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: 0.3s;
}

.next-button:hover {
    transform: scale(1.1);
}

.audio-controls {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: rgba(255,255,255,0.7);
    padding: 10px;
    border-radius: 50px;
    display: flex;
    align-items: center;
}

.audio-controls button {
    font-size: 1.5rem;
    background: none;
    border: none;
    cursor: pointer;
}

@keyframes bounce-in {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
}
</style>
</head>

<body>

<div class="container">
    <h1>Happy Birthday <br> Sarkar 🎉🎂</h1>
    <p class="subtitle"> Ready for your special surprise?</p>
    <button class="next-button" onclick="goToNextPage()">Let's Go ✨</button>
</div>

<div class="audio-controls">
    <button id="play-pause">▶️</button>
    <input type="range" id="volume" min="0" max="1" step="0.1" value="0.5">
</div>

<audio id="birthday-song" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
</audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>

<script>
const audio = document.getElementById('birthday-song');
const playPauseBtn = document.getElementById('play-pause');
const volumeControl = document.getElementById('volume');
let isPlaying = false;

audio.volume = volumeControl.value;

window.addEventListener('load', () => {
    setTimeout(() => {
        audio.play().then(() => {
            isPlaying = true;
            playPauseBtn.textContent = "⏸️";
        }).catch(() => {});
    }, 1000);
});

playPauseBtn.onclick = () => {
    if (isPlaying) {
        audio.pause();
        playPauseBtn.textContent = "▶️";
    } else {
        audio.play();
        playPauseBtn.textContent = "⏸️";
    }
    isPlaying = !isPlaying;
};

volumeControl.oninput = () => audio.volume = volumeControl.value;

function goToNextPage() {
    window.location.href = "memorylane.html";
}
</script>

</body>
</html>
